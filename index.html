<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Baby ❤️🥀</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at top, #1a1a1a, #000000);
      color: #ffffff;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .card {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      padding: 45px 40px;
      border-radius: 24px;
      max-width: 420px;
      box-shadow: 0 0 40px rgba(230, 57, 70, 0.15);
      animation: fadeIn 1.6s ease;
    }

    h1 {
      font-size: 2.4em;
      margin-bottom: 12px;
    }

    h1 span {
      color: #e63946;
    }

    p {
      font-size: 1.05em;
      line-height: 1.6;
      margin: 14px 0;
      opacity: 0.95;
    }

    .question {
      margin-top: 26px;
      font-size: 1.15em;
    }

    button {
      margin-top: 28px;
      padding: 14px 34px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, #b11226, #e63946);
      color: #ffffff;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(230, 57, 70, 0.4);
      transition: all 0.3s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(230, 57, 70, 0.65);
    }

    /* Floating hearts */
    .heart {
      position: absolute;
      bottom: -20px;
      font-size: 18px;
      color: rgba(230, 57, 70, 0.7);
      animation: floatUp linear infinite;
      z-index: 1;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      to {
        transform: translateY(-110vh) scale(1.4);
        opacity: 0;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <h1>My Baby <span>❤️🥀</span></h1>

    <p>
      In a world that moves too fast,<br>
      you are the moment I always want to stay in.
    </p>

    <p>
      Sweet heart. Strong presence.<br>
      My favorite place to exist. All day. Every day.
    </p>

    <p class="question">
      Will you be my Valentine?
    </p>

    <button onclick="yesClicked()">Yes, my love ❤️</button>
  </div>

  <script>
    function yesClicked() {
      document.getElementById("card").innerHTML = `
        <h1>It’s Always You <span>❤️</span></h1>

        <p>
          No games. No pause button.<br>
          Just us — choosing each other, every time.
        </p>

        <p>
          Same heart. Same direction.<br>
          Keeping each other sane. Always.
        </p>

        <p style="margin-top:24px; font-size:1.1em;">
          Happy Valentine’s Day in advance, my love ❤️🥀
        </p>
      `;
    }

    // Floating hearts generator
    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (6 + Math.random() * 4) + "s";
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 10000);
    }

    setInterval(createHeart, 500);
  </script>

</body>
</html>
